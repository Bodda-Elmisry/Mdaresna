# Use a certificate whose SAN matches RABBITMQ_TLS_HOST, chained to a CA trusted by API/Worker images.
listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /run/tls/ca.pem
ssl_options.certfile = /run/tls/cert.pem
ssl_options.keyfile = /run/tls/key.pem
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = false
management.tcp.ip = 127.0.0.1
